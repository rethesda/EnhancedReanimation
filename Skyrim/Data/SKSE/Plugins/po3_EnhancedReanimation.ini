[Settings]

;Teleport reanimated minions to the player after fast travel
bFixFastTravel = true

;Reanimated necromancers can cast reanimate spells
bReanimatedNecromancersCanCast = true

;Reanimate decapitated enemies
bReanimateDecapitatedNPCs = true


[Riding]

;Ride reanimated horses/mounts (not dragons)
bRideReanimatedMounts = true

;Patch all reanimate spells so mounts can be reanimated
bPatchSpellsForMounts = true
